<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="container mt-3">
    <div class="accordion" id="myAccordion">

        <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#item1">
            Đóng mở item 1
            </button>
        </h2>
        <div id="item1" class="accordion-collapse collapse show" data-bs-parent="#myAccordion">
            <div class="accordion-body">
            Đây là mục 1
            </div>
        </div>
        </div>

        <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#item2">
            Đóng mở item 2
            </button>
        </h2>
        <div id="item2" class="accordion-collapse collapse" data-bs-parent="#myAccordion">
            <div class="accordion-body">
            Đây là mục 2
            </div>
        </div>
        </div>

        <div class="accordion-item">
        <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#item3">
            Đóng mở item 3
            </button>
        </h2>
        <div id="item3" class="accordion-collapse collapse" data-bs-parent="#myAccordion">
            <div class="accordion-body">
            Đây là mục 3
            </div>
        </div>
        </div>

    </div>
    </div>

</body>
</html>
